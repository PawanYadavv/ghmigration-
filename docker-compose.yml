services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scm_catalog
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8001:8000"
    env_file: .env  # GITHUB_TOKEN, GITLAB_TOKEN, GITLAB_URL
    environment:
      # inside Docker the database host is "db" (service name), not localhost
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/scm_catalog
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
